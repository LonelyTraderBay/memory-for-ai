name: Fast Repro
'on':
  workflow_dispatch:
    inputs:
      suites:
        description: Comma list of suite-name substrings to run (empty = all)
        type: string
        default: ''
  push:
    branches: [qa/fast-**]
permissions:
  contents: read
jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib make git
      - name: Run bug-reproduction board
        shell: msys2 {0}
        run: scripts/repro.sh CC=clang CXX=clang++
        env:
          CBM_REPRO_ONLY: ${{ github.event.inputs.suites }}
