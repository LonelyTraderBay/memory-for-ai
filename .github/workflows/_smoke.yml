name: Smoke
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-python3 mingw-w64-clang-x86_64-curl unzip zip coreutils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binaries-windows-amd64
      - name: Extract release artifact
        shell: msys2 {0}
        run: |
          ARCH=amd64
          ARTIFACT_DIR="$(cygpath -u "$RUNNER_TEMP")/cbm-artifact"
          mkdir -p "$ARTIFACT_DIR"
          unzip -o "memory-for-ai-windows-${ARCH}.zip" -d "$ARTIFACT_DIR"
          test -s "$ARTIFACT_DIR/memory-for-ai.exe"
          # ONE executable per runtime set: a payload sibling would mean the
          # removed launcher split came back.
          test ! -e "$ARTIFACT_DIR/memory-for-ai.payload.exe"
          # Pre-flight the image from a profile-rooted directory: the shared
          # runner workspace is deliberately not a valid install root.
          PROFILE_ROOT="$(cygpath -u "$USERPROFILE")"
          LAUNCH_DIR="$(mktemp -d "$PROFILE_ROOT/cbm-release-version.XXXXXX")"
          # Best-effort cleanup with one retry: Windows holds the just-exited
          # image's file busy for ~100ms (section teardown / first-touch AV),
          # and a temp dir on an ephemeral runner must never fail the job.
          trap 'rm -rf "$LAUNCH_DIR" 2>/dev/null || { sleep 2; rm -rf "$LAUNCH_DIR" 2>/dev/null || true; }' EXIT
          cp "$ARTIFACT_DIR/memory-for-ai.exe" "$LAUNCH_DIR/"
          "$LAUNCH_DIR/memory-for-ai.exe" --version
      - name: Smoke test (shared wrapper)
        shell: msys2 {0}
        env:
          SMOKE_ARCH: amd64
          SMOKE_REQUIRE_UI: '1'
        run: |
          export CBM_SMOKE_ARTIFACT_DIR="$(cygpath -u "$RUNNER_TEMP")/cbm-artifact"
          bash test-infrastructure/vm/vm-smoke.sh
      - name: Security audits
        shell: msys2 {0}
        run: |
          ARTIFACT_DIR="$(cygpath -u "$RUNNER_TEMP")/cbm-artifact"
          scripts/security-strings.sh "$ARTIFACT_DIR/memory-for-ai.exe"
          PROFILE_ROOT="$(cygpath -u "$USERPROFILE")"
          SECURITY_DIR="$(mktemp -d "$PROFILE_ROOT/cbm-release-security.XXXXXX")"
          # Best-effort cleanup with one retry (see the version preflight).
          trap 'rm -rf "$SECURITY_DIR" 2>/dev/null || { sleep 2; rm -rf "$SECURITY_DIR" 2>/dev/null || true; }' EXIT
          cp "$ARTIFACT_DIR/memory-for-ai.exe" "$SECURITY_DIR/"
          TMPDIR="$SECURITY_DIR" \
            scripts/security-install.sh "$SECURITY_DIR/memory-for-ai.exe"
      - name: Windows Defender scan
        shell: pwsh
        run: |
          & "C:\Program Files\Windows Defender\MpCmdRun.exe" -SignatureUpdate 2>$null
          $artifactDir = Join-Path $env:RUNNER_TEMP "cbm-artifact"
          foreach ($binary in @("memory-for-ai.exe")) {
            $result = & "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File (Join-Path $artifactDir $binary) -DisableRemediation
            $code = $LASTEXITCODE
            Write-Host $result
            # MpCmdRun -Scan exit codes: 0 = clean, 2 = threat found. Any OTHER non-zero
            # means the scan engine could not run at all (e.g. hr=0x800106ba: the Defender
            # antimalware service is unavailable on the runner) — that is NOT a detection.
            # Fail soft on an engine failure so a transient runner-side AV outage can't
            # false-fail a release; only a real detection (exit 2) hard-blocks.
            if ($code -eq 2) {
              Write-Host "BLOCKED: Windows Defender flagged $binary!"; exit 1
            } elseif ($code -ne 0) {
              Write-Host "::warning::Windows Defender scan could not run for $binary (exit $code) - skipping AV gate on this runner"
            } else {
              Write-Host "=== Windows Defender: $binary clean ==="
            }
          }
