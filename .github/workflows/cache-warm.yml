name: Cache warm
'on':
  schedule:
    - cron: 17 2 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  warm-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-ccache make git
      - name: Compiler cache (restore)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-windows-latest-CLANG64-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-test-windows-latest-CLANG64-${{ github.ref }}-
            ccache-test-windows-latest-CLANG64-
      - name: Build (test runner + product, no tests)
        run: |
          source scripts/env.sh
          make -j"$(nproc)" -f Makefile.cbm build/c/test-runner cbm CC=clang CXX=clang++
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
      - name: ccache stats
        run: ccache -sv || ccache -s
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Compiler cache (save)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-windows-latest-CLANG64-${{ github.ref }}-${{ github.sha }}
