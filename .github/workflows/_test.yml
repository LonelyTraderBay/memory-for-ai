name: Test
'on':
  workflow_call:
    inputs:
      skip_perf:
        description: Skip timing-sensitive assertions on shared CI runners
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-python3 mingw-w64-clang-x86_64-ccache mingw-w64-clang-x86_64-clang-tools-extra mingw-w64-clang-x86_64-cppcheck make git zip unzip diffutils
      - name: Create protected per-user temp root
        shell: pwsh
        run: |
          $root = & scripts/ci/new-protected-temp-root.ps1 `
            -Prefix 'cbm-ci-tmp-' `
            -ProtectDir (Join-Path $env:GITHUB_WORKSPACE "build\c")
          "CBM_CI_TEMP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compiler cache (content-verified)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-windows-latest-CLANG64-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-test-windows-latest-CLANG64-${{ github.ref }}-
            ccache-test-windows-latest-CLANG64-
      - name: Canonical Windows x64 native verification
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Phase Native -MsysRoot '${{ steps.msys2.outputs['msys2-location'] }}'
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
      - name: ccache stats
        if: always()
        shell: msys2 {0}
        run: ccache -s || true
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
      - name: Save compiler cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-windows-latest-CLANG64-${{ github.ref }}-${{ github.sha }}
  test-package-wrappers:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-python3 mingw-w64-clang-x86_64-ccache mingw-w64-clang-x86_64-clang-tools-extra mingw-w64-clang-x86_64-cppcheck make git zip unzip diffutils
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: pkg/go/go.mod
          cache: false
      - name: Canonical Packages verification
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Phase Packages -MsysRoot '${{ steps.msys2.outputs['msys2-location'] }}'
  test-frontend:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-python3 mingw-w64-clang-x86_64-ccache mingw-w64-clang-x86_64-clang-tools-extra mingw-w64-clang-x86_64-cppcheck make git zip unzip diffutils
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Canonical Frontend verification
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Phase Frontend -MsysRoot '${{ steps.msys2.outputs['msys2-location'] }}'
  test-windows-guards:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-python3 mingw-w64-clang-x86_64-ccache mingw-w64-clang-x86_64-clang-tools-extra mingw-w64-clang-x86_64-cppcheck make git zip unzip diffutils
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Canonical Product verification
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Phase Product -MsysRoot '${{ steps.msys2.outputs['msys2-location'] }}'
  artifact-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Release selection adversarial fixtures (no product build)
        run: |
          bash tests/test_vt_candidate_selection_contract.sh
          bash tests/test_release_archive_extractor_contract.sh
          bash tests/test_release_gate_chain_contract.sh
