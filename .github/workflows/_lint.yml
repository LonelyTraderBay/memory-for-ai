name: Lint & Security
'on':
  workflow_call: {}
permissions:
  contents: read
  security-events: read
jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-python3 mingw-w64-clang-x86_64-ccache mingw-w64-clang-x86_64-clang-tools-extra mingw-w64-clang-x86_64-cppcheck make git zip unzip diffutils
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Canonical Lint verification
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Phase Lint -MsysRoot '${{ steps.msys2.outputs['msys2-location'] }}'
