name: PR
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  security-events: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  security:
    uses: ./.github/workflows/_security.yml
    secrets: inherit
  lint:
    uses: ./.github/workflows/_lint.yml
  test:
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.f.outputs.product }}
    steps:
      - name: Detect product-code changes
        id: f
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The full .diff endpoint rejects large-but-valid PRs at 20k lines.
          # The paginated files endpoint remains filename-only for this gate.
          FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          printf '%s\n' "$FILES"
          if printf '%s\n' "$FILES" | grep -qE '^(src/|internal/|install\.(sh|ps1)|scripts/build\.sh|scripts/smoke-test\.sh|scripts/smoke-local\.sh|scripts/smoke-fixture-server\.py|scripts/gen-third-party-notices\.sh|scripts/env\.sh|test-infrastructure/vm/(vm-smoke\.sh|windows-user-path-guard\.ps1)|Makefile\.cbm)'; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
          fi
  pr-smoke:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.product == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-python3 mingw-w64-clang-x86_64-ccache make coreutils curl zip unzip
      - name: Compiler cache (content-verified)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-smoke-windows-latest-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-smoke-windows-latest-${{ github.ref }}-
      - name: Build prod + smoke (Windows)
        shell: msys2 {0}
        run: |
          scripts/build.sh CC=clang CXX=clang++
          SMOKE_ARCH=amd64 bash test-infrastructure/vm/vm-smoke.sh
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1000M
  ci-ok:
    needs: [security, lint, test, changes, pr-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: All PR stages must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: scripts/ci/require-all-green.sh
