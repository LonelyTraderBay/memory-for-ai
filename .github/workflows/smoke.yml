name: Smoke (Windows x64)
'on':
  workflow_dispatch: null
  push:
    branches: [qa/smoke-**]
permissions:
  contents: read
jobs:
  smoke-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-python3 make git coreutils
      - name: Build (production path with explicit test seams)
        shell: msys2 {0}
        run: scripts/build.sh CC=clang CXX=clang++ TEST_SEAMS=1
      - name: Smoke invariants
        shell: msys2 {0}
        run: |
          chmod +x scripts/smoke-invariants.sh
          BIN=build/c/memory-for-ai
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          scripts/smoke-invariants.sh "$BIN"
