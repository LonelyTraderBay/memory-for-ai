name: Bug Repro Board
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  repro-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: CLANG64
          path-type: inherit
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-compiler-rt mingw-w64-clang-x86_64-zlib make git
      - name: Run bug-reproduction board
        shell: msys2 {0}
        run: scripts/repro.sh CC=clang CXX=clang++
